name: CI

# The repo makes checkable claims -- a system count, a line count, a generated
# page, two provenance enums -- and nothing checked them. These are the gates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: Data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/provenance.py reads the commits that fetched each city's
          # geometry; a shallow clone cannot see them.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Data-integrity suite
        # Schema, geometry, the README's own counts, both enums, and whether
        # index.html is still what data/ generates.
        run: python3 -m unittest discover -s tests -v

      - name: Comparability audit
        # Runs read-only; fails if any measure_def or mode_scope stops resolving.
        run: python3 tools/comparability.py

      - name: Audit output is committed
        # comparability.py --write must be a no-op on a clean tree. If it is
        # not, the graded CSVs were generated from different inputs than the
        # ones in the commit.
        run: |
          python3 tools/comparability.py --write
          if ! git diff --quiet -- data/research/comparability.csv data/research/ridership_verified.csv; then
            echo "::error::The graded CSVs are stale. Run 'python3 tools/comparability.py --write' and commit."
            git --no-pager diff --stat -- data/research
            exit 1
          fi

      - name: Geometry provenance is current
        # provenance.csv is derived from git history and the files themselves,
        # so regenerating it must be a no-op. If it is not, a network file
        # changed without its source record following.
        run: |
          python3 tools/provenance.py --write
          if ! git diff --quiet -- data/networks/provenance.csv; then
            echo "::error::provenance.csv is stale. Run 'python3 tools/provenance.py --write' and commit."
            git --no-pager diff -- data/networks/provenance.csv | head -40
            exit 1
          fi

  model:
    name: Ridership model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy
        run: python3 -m pip install --quiet numpy

      - name: Fit the ladder
        # The model must run end to end and still report the axis it is meant
        # to control for.
        run: |
          python3 tools/ridership_model.py | tee model.txt
          grep -q "H. + numerator mode scope" model.txt \
            || { echo "::error::spec H (axis 2) is missing from the ladder"; exit 1; }

      - name: README quotes the model it ships
        # The README states spec G's is_boarding coefficient and p-value. A
        # station-count change moved them once while the prose stood still, so
        # the quoted figure is parsed out of README.md and compared with the
        # run above. A number written from memory drifts; one asserted here
        # cannot.
        run: |
          python3 - <<'EOF'
          import re, sys
          readme = open("README.md", encoding="utf-8").read()
          model  = open("model.txt", encoding="utf-8").read()
          q = re.search(r"`is_boarding` moves from \+[\d.]+ \(p=[\d.]+\) to\s*\+([\d.]+) \(p=([\d.]+)\)", readme)
          g = re.search(r"^G\..*?is_boarding\s+\+([\d.]+)\s+se\s+[\d.]+\s+p=([\d.]+)", model, re.S | re.M)
          if not q or not g:
              sys.exit("could not find the spec G is_boarding figure in README.md or model output")
          qc, qp = float(q.group(1)), float(q.group(2))
          mc, mp = float(g.group(1)), float(g.group(2))
          if abs(qc - mc) > 0.0005 or abs(round(mp, 3) - qp) > 0.0005:
              sys.exit(f"README quotes is_boarding +{qc} (p={qp}) but the model reports +{mc:.3f} (p={mp:.3f}). Update the README.")
          print(f"README figure matches the model: +{mc:.3f} (p={mp:.3f})")
          EOF
